<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Døgngrader, bruksanvisning</title>
<meta name="description" content="Bruksanvisning for døgngrader-måleren, norsk og engelsk, én A4-side (PDF).">
<style>
  :root { --bg: #f7f6f3; --ink: #1a1614; --muted: #6e645d; --accent: #8a6a36; --edge: #ddd6cf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141211; --ink: #f1ece6; --muted: #a39890; --accent: #b8955d; --edge: #3a3330; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 Georgia, serif; }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 1.2rem 1rem 3rem; }
  h1 { font-size: 1.8rem; margin: .4rem 0; }
  .muted { color: var(--muted); font-family: system-ui, sans-serif; font-size: .95rem; }
  .btn { display: inline-block; margin: .8rem .6rem .8rem 0; padding: .7rem 1.2rem; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font: 600 1rem system-ui, sans-serif; }
  .btn.ghost { background: none; color: var(--accent); border: 1px solid var(--edge); }
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; margin-top: 1rem; }
  figure { margin: 0; background: #fff; border-radius: 12px; padding: .6rem; }
  figure img { width: 100%; height: auto; display: block; }
  figcaption { color: #444; font: .85rem/1.35 system-ui, sans-serif; margin-top: .3rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bruksanvisning <span class="muted">/ User guide</span></h1>
  <p class="muted">Én A4-side, norsk og engelsk. Versjon 1.1, firmware 0.6.0.</p>
  <a class="btn" href="doegngrader-bruksanvisning.pdf">Åpne PDF / Open PDF</a><a class="btn ghost" href="../">Til appen / To the app</a>
  <div class="figs">
    <figure><img src="display.png" alt="Displayet"><figcaption>1 døgngrader, 2 vilt (–) eller restaurant (=), 3 temperatur, 4 smilefjes, 5 Bluetooth, 6 batteri.</figcaption></figure>
    <figure><img src="nullstill.png" alt="Ny periode"><figcaption>A Ny periode: binders fra Reset til Gnd i 1 sekund. Batteriet med + opp.</figcaption></figure>
    <figure><img src="apne.png" alt="Åpne bakplaten"><figcaption>B Lirk av bakplaten med en flat skrutrekker i sporet nederst.</figcaption></figure>
  </div>
</div>
</body>
</html>
