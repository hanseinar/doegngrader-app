<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modna, under bygging</title>
<meta name="description" content="Modna, måler for modning av kjøtt. Siden er under bygging.">
<meta name="theme-color" content="#121110">
<link rel="icon" href="app/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Midlertidig forside mens landingssiden gjøres ferdig. Samme farger som appen. */
:root{color-scheme:dark;--ink:#efe7da;--mut:#b5aa99;--line:#36312b;--brass:#c9a46a;--brass2:#e2c48d}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:32px 20px;color:var(--ink);font:16.5px/1.6 Inter,system-ui,sans-serif;
 background:radial-gradient(70% 80% at 50% 38%,#3a2e20 0%,#1b1815 48%,#121110 82%) #121110}
main{text-align:center;max-width:620px}
.logo{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(46px,10vw,92px);letter-spacing:.32em;margin-right:-.32em;color:var(--brass2);font-weight:400;line-height:1;margin-bottom:22px}
.rule{width:180px;height:1px;background:var(--brass);opacity:.6;margin:0 auto 24px}
h1{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(26px,4.6vw,38px);margin:0 0 30px;line-height:1.2}
.meter{width:min(240px,56vw);margin:0 auto 30px;filter:drop-shadow(0 22px 30px rgba(0,0,0,.6))}
.meter img{width:100%;height:auto;display:block}
p{color:var(--mut);margin:0 auto 26px;max-width:46ch}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 28px;border-radius:999px;background:var(--brass);color:#1a1510;font-weight:600;text-decoration:none}
.btn:focus-visible{outline:2px solid var(--brass2);outline-offset:3px}
small{display:block;margin-top:40px;color:#8c8275;font-size:13.5px}
</style>
</head>
<body>
<main>
 <div class="logo">MODNA</div>
 <div class="rule"></div>
 <h1>Vit når kjøttet er klart.</h1>
 <div class="meter"><img src="img/maaler.png" alt="Modna-måleren" width="900" height="845"></div>
 <p>En liten måler som henger ved kjøttet og teller modningen i døgngrader eller dager. Siden er under bygging.</p>
 <a class="btn" href="app/?demo">Prøv demo av appen</a>
 <small>© 2026 Hans Einar Steinsland · Hjelmeland</small>
</main>
</body>
</html>
